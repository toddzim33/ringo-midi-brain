[general]
alsa_name=rtpmidid
control=/var/run/rtpmidid/control.sock
log_level=info

# BandHelper (and any rtpMIDI client) will see "ringo" when scanning the network
[rtpmidi_announce]
name=ringo
port=5004

# Don't auto-discover other rtpMIDI devices on the network
[rtpmidi_discover]
enabled=false

# Creates the "Network Export" ALSA port -- incoming rtpMIDI data arrives here
[alsa_announce]
name=Network Export

# DO NOT auto-export hardware ports -- the brain handles all routing
# [alsa_hw_auto_export] is intentionally disabled
